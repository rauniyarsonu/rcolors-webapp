spring.application.name=rcolors-backend
server.port=${PORT:8080}

# Content (projects, clients, estate) is read from classpath:data/ by default.
# Point app.data-dir at a folder on disk to edit the JSON without rebuilding the jar.
app.data-dir=

# Origins allowed to call /api from the browser (the Vite dev server, a separately hosted frontend)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Contact and enquiry submissions are stored in the database. To also email them,
# set NOTIFY_EMAIL plus the spring.mail.* settings (e.g. MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD).
app.notify.to=${NOTIFY_EMAIL:}
app.notify.from=${NOTIFY_FROM:no-reply@rcolorsgroup.com}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Local default: an H2 file database under backend/data/. Use the "prod" profile for PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/rcolors
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

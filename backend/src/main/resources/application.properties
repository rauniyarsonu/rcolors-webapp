spring.application.name=rcolors-backend
server.port=${PORT:8080}

# Content lives in the database. On first start, when the content tables are empty,
# DataSeeder imports the JSON under classpath:data/ (or the folder in app.data-dir).
app.data-dir=
app.seed.enabled=${SEED_ENABLED:true}

# Origins allowed to call /api from the browser (the Vite dev server, a separately hosted frontend)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Contact and enquiry submissions are stored in the database. To also email them,
# set NOTIFY_EMAIL plus the spring.mail.* settings (e.g. MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD).
app.notify.to=${NOTIFY_EMAIL:}
app.notify.from=${NOTIFY_FROM:no-reply@rcolorsgroup.com}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Admin panel (/admin): one admin, no user table. Login stays off until all three are set.
# ADMIN_PASSWORD_HASH is BCrypt and ADMIN_JWT_SECRET at least 32 bytes; see README > Configuration.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password-hash=${ADMIN_PASSWORD_HASH:}
app.admin.jwt-secret=${ADMIN_JWT_SECRET:}
# Base URL of the admin panel, used for links in notification emails (e.g. https://example.com/admin)
app.admin.panel-url=${ADMIN_PANEL_URL:}
# Our own filter chains (auth/SecurityConfig) replace Spring Boot's generated default user
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Careers: résumé uploads (PDF/DOC/DOCX, 5 MB), and an optional "we received your application" email
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Read the rest of an oversized upload so the browser gets the 400 instead of a reset connection
server.tomcat.max-swallow-size=10MB
app.careers.ack-email=${CAREERS_ACK_EMAIL:false}

# Local default: an H2 file database under backend/data/. Use the "prod" profile for PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/rcolors
spring.datasource.username=sa
spring.datasource.password=
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it.
# baseline-on-migrate lets an existing database created by ddl-auto=update adopt the migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Column type for binary data in migrations (V2 résumés); application-prod.properties sets PostgreSQL's
spring.flyway.placeholders.binary_type=BLOB
